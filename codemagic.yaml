workflows:
  ios-sideload-workflow:
    name: iOS Sideload Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build unsigned iOS release
        script: |
          flutter build ios --release --no-codesign
      - name: Package into IPA for Sideloadly
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          # Remove any hidden macOS system files to prevent zip corruption
          find Payload -name ".DS_Store" -delete
          # Create the IPA cleanly without extra resource forks (-X flag)
          zip -r -X flutter_demo.ipa Payload
    artifacts:
      - flutter_demo.ipa