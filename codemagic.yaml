workflows:
  ios-sideload-workflow:
    name: iOS Sideload Demo Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.1
      vars:
        # Temporary sideload-demo endpoint. Replace with HTTPS before production.
        API_BASE_URL: "http://13.213.32.9/fintech-service"
        ALLOW_INSECURE_HTTP: "true"
    scripts:
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get
      - name: Validate release configuration
        script: |
          set -e
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "API_BASE_URL is required."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*)
              if [ "${ALLOW_INSECURE_HTTP:-false}" = "true" ]; then
                echo "HTTPS builds must set ALLOW_INSECURE_HTTP=false."
                exit 1
              fi
              ;;
            http://13.213.32.9/fintech-service)
              if [ "${ALLOW_INSECURE_HTTP:-false}" != "true" ]; then
                echo "The temporary HTTP demo endpoint requires ALLOW_INSECURE_HTTP=true."
                exit 1
              fi
              ;;
            *)
              echo "API_BASE_URL must use HTTPS or match the approved HTTP demo endpoint."
              exit 1
              ;;
          esac
      - name: Configure demo-only iOS HTTP exception
        script: |
          set -e
          PLIST="$CM_BUILD_DIR/ios/Runner/Info.plist"
          if [ "${ALLOW_INSECURE_HTTP:-false}" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          fi
      - name: Run Flutter tests
        script: |
          set -e
          flutter test
      - name: Check for Dart compile errors
        script: |
          set -e
          flutter analyze --no-fatal-infos
      - name: Build unsigned iOS release
        script: |
          set -e
          flutter build ios --release --no-codesign \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="ALLOW_INSECURE_HTTP=$ALLOW_INSECURE_HTTP"
      - name: Package into IPA for Sideloadly
        script: |
          set -e
          IPA_DIR="$CM_BUILD_DIR/build/sideload"
          PAYLOAD_DIR="$IPA_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$CM_BUILD_DIR/build/ios/iphoneos/Runner.app" "$PAYLOAD_DIR/"
          find "$PAYLOAD_DIR" -name ".DS_Store" -delete
          cd "$IPA_DIR"
          zip -r -X flutter_demo.ipa Payload
    artifacts:
      - build/sideload/flutter_demo.ipa
